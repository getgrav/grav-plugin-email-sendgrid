PLUGIN_EMAIL_SENDGRID:
  PROVIDER_INSTRUCTIONS: "In SendGrid, go to Settings, then Mail Settings, then Event Webhooks, and add a webhook with this address. Tick Delivered, Bounced, Dropped, Spam Reports, Opened and Clicked, and leave Processed, Deferred and the three unsubscribe events off, because nothing here acts on them. Then turn on Signed Event Webhook and press Save: the verification key does not exist until that first save. Copy the key it shows into the Verification key field in this plugin's settings, exactly as SendGrid prints it, and the PEM wrapper will be added for you."
  ECHO_NOTE: "SendGrid does not send message headers back in its webhooks. It sends the message's custom args instead, as top-level fields on the event, so a send id has to go out as a custom arg — over SMTP that is the unique_args map inside the X-SMTPAPI header. Correlating on Message-ID needs none of that and works on every event, because SendGrid echoes it as smtp-id."
