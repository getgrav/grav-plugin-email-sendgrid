PLUGIN_EMAIL_SENDGRID:
  TRANSPORT_LABEL: "Transport"
  TRANSPORT_API: "API (faster)"
  TRANSPORT_SMTP: "SMTP"
  API_KEY_LABEL: "API Key"
  API_KEY_HELP: "The key SendGrid sends with. Settings, then API Keys, then Create API Key. Mail Send is all it needs to send."
  DELIVERY_REPORTS_TITLE: "Delivery reports"
  DELIVERY_REPORTS_TEXT: "SendGrid can tell this site what happened to each message it sent — delivered, bounced, marked as spam, opened, clicked. An add-on that receives those reports gives you a webhook address to register; these two fields are what SendGrid needs from this end. Nothing here affects sending."
  VERIFICATION_KEY_LABEL: "Verification key"
  VERIFICATION_KEY_HELP: "The key that proves an event really came from SendGrid. Settings, then Mail Settings, then Event Webhooks — open the webhook, turn on Signed Event Webhook, press Save, and the key appears. Paste it exactly as SendGrid shows it. Pressing Set up fills this in for you."
  SETUP_API_KEY_LABEL: "Setup API Key"
  SETUP_API_KEY_HELP: "Only needed if the key above is restricted to Mail Send, which cannot create a webhook. Make a second key in SendGrid with full access to Webhook and paste it here. Nothing sends with it; it is used only when you press Set up."
  PROVIDER_INSTRUCTIONS: "In SendGrid, go to Settings, then Mail Settings, then Event Webhooks, and add a webhook with this address. Tick Delivered, Bounced, Dropped, Spam Reports, Opened and Clicked, and leave Processed, Deferred and the three unsubscribe events off, because nothing here acts on them. Then turn on Signed Event Webhook and press Save: the verification key does not exist until that first save. Copy the key it shows into the Verification key field in this plugin's settings, exactly as SendGrid prints it, and the PEM wrapper will be added for you."
  ECHO_NOTE: "SendGrid does not send message headers back in its webhooks. It sends the message's custom args instead, as top-level fields on the event, so a send id has to go out as a custom arg — over SMTP that is the unique_args map inside the X-SMTPAPI header. Correlating on Message-ID needs none of that and works on every event, because SendGrid echoes it as smtp-id."
  RECEIVING_MAIL_TITLE: "Receiving mail"
  RECEIVING_MAIL_TEXT: "SendGrid's Inbound Parse can post the mail sent to your domain to this site, for an add-on that receives email such as a helpdesk. The add-on gives you the address to paste into SendGrid. These fields are optional: without them, the long secret in that address is what protects it. Nothing here affects sending."
  INBOUND_PUBLIC_KEY_LABEL: "Inbound public key"
  INBOUND_PUBLIC_KEY_HELP: "The public key of a Parse security policy with signature verification, if you attached one to your Inbound Parse host through SendGrid's API. Signed posts can only be checked where PHP keeps the raw request body (enable_post_data_reading = Off for the webhook address); otherwise leave this empty, or every message is refused."
  INBOUND_USERNAME_LABEL: "Inbound username"
  INBOUND_USERNAME_HELP: "Optional. If you put a username and password in the Destination URL in SendGrid (https://name:password@…), enter the same pair here and every post must carry them."
  INBOUND_PASSWORD_LABEL: "Inbound password"
  INBOUND_PASSWORD_HELP: "The password that goes with the inbound username. Set both or neither."

