name: Email Sendgrid
slug: email-sendgrid
type: plugin
version: 1.2.0
testing: false
description: Sendgrid integration for new Email plugin
icon: envelope
author:
  name: Team Grav
  email: devs@getgrav.org
homepage: https://github.com/getgrav/grav-plugin-email-sendgrid
keywords: grav, plugin, etc
bugs: https://github.com/getgrav/grav-plugin-email-sendgrid/issues
docs: https://github.com/getgrav/grav-plugin-email-sendgrid/blob/develop/README.md
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: email, version: '>=4.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    transport:
      type: select
      size: small
      label: PLUGIN_EMAIL_SENDGRID.TRANSPORT_LABEL
      default: api
      options:
        api: PLUGIN_EMAIL_SENDGRID.TRANSPORT_API
        smtp: PLUGIN_EMAIL_SENDGRID.TRANSPORT_SMTP

    api_key:
      type: password
      label: PLUGIN_EMAIL_SENDGRID.API_KEY_LABEL
      help: PLUGIN_EMAIL_SENDGRID.API_KEY_HELP
      validate:
        required: true

    delivery_reports:
      type: section
      title: PLUGIN_EMAIL_SENDGRID.DELIVERY_REPORTS_TITLE
      underline: true
      text: PLUGIN_EMAIL_SENDGRID.DELIVERY_REPORTS_TEXT

    public_key:
      type: textarea
      rows: 3
      label: PLUGIN_EMAIL_SENDGRID.VERIFICATION_KEY_LABEL
      help: PLUGIN_EMAIL_SENDGRID.VERIFICATION_KEY_HELP

    setup_api_key:
      type: password
      label: PLUGIN_EMAIL_SENDGRID.SETUP_API_KEY_LABEL
      help: PLUGIN_EMAIL_SENDGRID.SETUP_API_KEY_HELP

    receiving_mail:
      type: section
      title: PLUGIN_EMAIL_SENDGRID.RECEIVING_MAIL_TITLE
      underline: true
      text: PLUGIN_EMAIL_SENDGRID.RECEIVING_MAIL_TEXT

    inbound_public_key:
      type: textarea
      rows: 3
      label: PLUGIN_EMAIL_SENDGRID.INBOUND_PUBLIC_KEY_LABEL
      help: PLUGIN_EMAIL_SENDGRID.INBOUND_PUBLIC_KEY_HELP

    inbound_username:
      type: text
      label: PLUGIN_EMAIL_SENDGRID.INBOUND_USERNAME_LABEL
      help: PLUGIN_EMAIL_SENDGRID.INBOUND_USERNAME_HELP

    inbound_password:
      type: password
      label: PLUGIN_EMAIL_SENDGRID.INBOUND_PASSWORD_LABEL
      help: PLUGIN_EMAIL_SENDGRID.INBOUND_PASSWORD_HELP
